<!doctype html>
<html><head><meta charset="utf-8"><title>Weerbericht icons</title>
<style>
 body{background:#111;color:#e1e1e1;font-family:Roboto,Arial,sans-serif;margin:16px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
 .c{background:#1c1c1c;border-radius:12px;padding:8px;text-align:center;font-size:11px}
 .c svg{width:48px;height:48px}
 .rain{fill:#30b3ff}.sun{fill:#fdd93c}.moon{fill:#fcf497}.cloud-back{fill:#d4d4d4}.cloud-front{fill:#f9f9f9}.snow{fill:#f9f9f9}.hail{fill:#d4e8f5}
 #card{max-width:500px;margin:16px 0}
</style></head><body>
<div id="card"></div>
<div class="grid" id="g"></div>
<script src="../custom_components/weerbericht/frontend/weerbericht-card.js"></script>
<script>
const names={1372:"zonnig",1373:"onbewolkt",1374:"zwaar bewolkt",1375:"opklaringen",1377:"lichte regen",1378:"matige regen",1379:"zware regen",1380:"lichte bui+zon",1382:"matige bui+zon",1384:"zware bui+zon",1386:"motregen",1387:"motregen+opkl",1389:"onweer matige regen",1390:"onweer zware regen",1391:"onweer bui+zon",1393:"onweer zware bui+zon",1395:"onweer hagel",1396:"onweer hagel+zon",1398:"winterse buien onweer",1401:"sneeuw onweer",1404:"lichte sneeuwbui",1405:"lichte sneeuwbui+zon",1407:"matige sneeuwbui",1410:"zware sneeuwbui",1413:"natte sneeuw",1414:"natte sneeuw+zon",1416:"hagelbui",1417:"hagelbui+zon",1419:"ijzel",1420:"mist",1423:"windstoten"};
const g=document.getElementById('g');
for(const [code,n] of Object.entries(names)){
  const d=document.createElement('div');d.className='c';
  d.innerHTML=iconFor(+code,null,false)+iconFor(+code,null,true)+'<br>'+code+' '+n;g.appendChild(d);}
// mock card with tonight's real data
const fc=[["2026-10-05T00:00:00+02:00",22,10,1373],["2026-10-06T00:00:00+02:00",22,11,1375],["2026-10-07T00:00:00+02:00",24,12,1384],["2026-10-08T00:00:00+02:00",15,9,1380],["2026-10-09T00:00:00+02:00",14,9,1377],["2026-10-10T00:00:00+02:00",15,9,1384],["2026-10-11T00:00:00+02:00",15,9,1380]].map(([dt,t,l,c])=>({datetime:dt,temperature:t,templow:l,weather_type:c,condition:"rainy"}));
const hass={language:"en",locale:{language:"en",time_zone:"local"},config:{time_zone:"Europe/Amsterdam",unit_system:{temperature:"°C"}},
 states:{"weather.weerbericht":{entity_id:"weather.weerbericht",state:"clear-night",attributes:{friendly_name:"Thuis",temperature:13,temperature_unit:"°C",weather_type:1376,raw_condition:"partlycloudy",night:true,today_high:22,today_low:10,weather_text:"Opklaringen"}}},
 localize:(k)=>({"component.weather.entity_component._.state.partlycloudy":"Partly cloudy"})[k]||"",
 connection:{subscribeMessage:(cb)=>{setTimeout(()=>cb({type:"daily",forecast:fc}),0);return Promise.resolve(()=>{});}}};
const card=document.createElement('weerbericht-card');document.getElementById('card').appendChild(card);
card.setConfig({entity:"weather.weerbericht"});card.hass=hass;
document.querySelector('style').insertAdjacentHTML('afterend','<style>weerbericht-card{display:block;background:#1c1c1c;border-radius:12px;color:#e1e1e1;--secondary-text-color:#9b9b9b}</style>');
</script></body></html>
